<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ઉત્સર્જન અને શોષણ વર્ણપટ સિમ્યુલેશન</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 10px;
            background: #0b1120;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 8px 18px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { opacity: 0.9; transform: scale(1.02); }
        select {
            padding: 8px 14px;
            background: #1e293b;
            color: white;
            border: 1px solid #475569;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: #020617;
            border: 1px solid #334155;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button id="toggleGasBtn" onclick="toggleGas()">વાયુ પાત્ર ઉમેરો</button>
        <select id="gasSelect" onchange="changeGas()" disabled>
            <option value="hydrogen">હાઇડ્રોજન વાયુ (H)</option>
            <option value="sodium">સોડિયમ વાષ્પ (Na)</option>
        </select>
    </div>

    <canvas id="simCanvas" width="800" height="420"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        let hasGas = false;
        let gasType = 'hydrogen';

        // હાઇડ્રોજન અને સોડિયમની શોષણ રેખાઓ
        const gasLines = {
            hydrogen: [
                { pos: 0.12, name: '410nm', col: '#c084fc', idx: 0 },
                { pos: 0.22, name: '434nm', col: '#818cf8', idx: 1 },
                { pos: 0.42, name: '486nm', col: '#38bdf8', idx: 2 },
                { pos: 0.86, name: '656nm', col: '#f87171', idx: 6 }
            ],
            sodium: [
                { pos: 0.62, name: '589nm', col: '#fde047', idx: 4 }
            ]
        };

        const colors = ['#7e22ce', '#2563eb', '#06b6d4', '#22c55e', '#eab308', '#f97316', '#ef4444'];

        // એનિમેટેડ કણો (Photons)
        let whitePhotons = [];
        let spectralPhotons = [];

        function initPhotons() {
            whitePhotons = [];
            for(let i = 0; i < 25; i++) {
                whitePhotons.push({
                    x: 65 + Math.random() * 290,
                    y: 210 + (Math.random() - 0.5) * 6,
                    speed: 2.2 + Math.random() * 0.8
                });
            }
            spectralPhotons = [];
            for(let i = 0; i < 45; i++) {
                let colorIdx = Math.floor(Math.random() * colors.length);
                spectralPhotons.push({
                    progress: Math.random(),
                    speed: 0.012 + Math.random() * 0.006,
                    colorIdx: colorIdx
                });
            }
        }
        initPhotons();

        function toggleGas() {
            hasGas = !hasGas;
            const btn = document.getElementById('toggleGasBtn');
            const select = document.getElementById('gasSelect');
            if (hasGas) {
                btn.innerText = "વાયુ પાત્ર હટાવો";
                btn.style.background = "#22c55e";
                select.disabled = false;
            } else {
                btn.innerText = "વાયુ પાત્ર ઉમેરો";
                btn.style.background = "#ef4444";
                select.disabled = true;
            }
        }

        function changeGas() {
            gasType = document.getElementById('gasSelect').value;
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const srcX = 65, srcY = 210;
            const prismTipX = 390, prismBaseY = 300, prismTopY = 110;
            const prismEntryX = 358, prismExitX = 405;
            const screenX = 660, screenY = 90, screenH = 240, screenW = 34;

            // ૧. સફેદ પ્રકાશ સોર્સ ગ્લો
            let glow = ctx.createRadialGradient(srcX, srcY, 4, srcX, srcY, 26);
            glow.addColorStop(0, '#ffffff');
            glow.addColorStop(0.4, 'rgba(255, 255, 255, 0.8)');
            glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(srcX, srcY, 26, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(srcX, srcY, 14, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#94a3b8';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("સફેદ પ્રકાશ સ્ત્રોત", srcX, srcY + 36);

            // ૨. સતત વહેતો સફેદ બીમ
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(srcX + 14, srcY);
            ctx.lineTo(prismEntryX, srcY);
            ctx.stroke();

            // સફેદ ફોટોન કણોનું એનિમેશન
            whitePhotons.forEach(p => {
                p.x += p.speed;
                if (p.x > prismEntryX) p.x = srcX + 14;

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
                ctx.fill();
            });

            // ૩. વાયુ પાત્ર (Gas Chamber)
            if (hasGas) {
                const chamberX = 175, chamberY = 145, chamberW = 85, chamberH = 130;
                ctx.fillStyle = gasType === 'hydrogen' ? 'rgba(56, 189, 248, 0.16)' : 'rgba(234, 179, 8, 0.16)';
                ctx.strokeStyle = gasType === 'hydrogen' ? '#38bdf8' : '#eab308';
                ctx.lineWidth = 2;
                ctx.fillRect(chamberX, chamberY, chamberW, chamberH);
                ctx.strokeRect(chamberX, chamberY, chamberW, chamberH);

                // વાયુ અણુઓનું બ્રાઉનિયન ગતિશીલ હલનચલન
                const time = Date.now() * 0.003;
                for (let i = 0; i < 9; i++) {
                    let ax = chamberX + 15 + ((i * 20 + Math.sin(time + i) * 12 + 60) % (chamberW - 30));
                    let ay = chamberY + 20 + ((i * 14 + Math.cos(time + i) * 12 + 80) % (chamberH - 35));
                    ctx.fillStyle = gasType === 'hydrogen' ? '#7dd3fc' : '#fde047';
                    ctx.beginPath();
                    ctx.arc(ax, ay, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = gasType === 'hydrogen' ? '#38bdf8' : '#eab308';
                ctx.font = 'bold 12px sans-serif';
                ctx.fillText(gasType === 'hydrogen' ? "H₂ વાયુ પાત્ર" : "Na વાષ્પ પાત્ર", chamberX + chamberW / 2, chamberY + chamberH + 18);
            }

            // ૪. પ્રિઝમ
            ctx.beginPath();
            ctx.moveTo(prismTipX, prismTopY);
            ctx.lineTo(prismTipX + 65, prismBaseY);
            ctx.lineTo(prismTipX - 65, prismBaseY);
            ctx.closePath();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.fill();
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#cbd5e1';
            ctx.font = '13px sans-serif';
            ctx.fillText("પ્રિઝમ", prismTipX, prismBaseY + 22);

            // પ્રિઝમ અંદર વક્રીભવન
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(prismEntryX, srcY);
            ctx.lineTo(prismExitX, srcY);
            ctx.stroke();

            // ૫. વર્ણપટ સ્ક્રીન
            let grad = ctx.createLinearGradient(0, screenY, 0, screenY + screenH);
            grad.addColorStop(0.0, '#7e22ce');
            grad.addColorStop(0.18, '#2563eb');
            grad.addColorStop(0.35, '#06b6d4');
            grad.addColorStop(0.52, '#22c55e');
            grad.addColorStop(0.70, '#eab308');
            grad.addColorStop(0.85, '#f97316');
            grad.addColorStop(1.0, '#ef4444');

            ctx.fillStyle = grad;
            ctx.fillRect(screenX, screenY, screenW, screenH);
            ctx.strokeStyle = '#94a3b8';
            ctx.strokeRect(screenX, screenY, screenW, screenH);

            // શોષાયેલી લાઈનોની યાદી
            const absorbedIndices = hasGas ? gasLines[gasType].map(l => l.idx) : [];

            // ૬. રંગબેરંગી વિભાજિત કિરણો
            colors.forEach((col, idx) => {
                let targetY = screenY + (idx * (screenH / (colors.length - 1)));
                let isAbsorbed = absorbedIndices.includes(idx);

                ctx.save();
                ctx.strokeStyle = isAbsorbed ? 'rgba(255,255,255,0.05)' : col;
                ctx.lineWidth = isAbsorbed ? 0.8 : 2;
                ctx.beginPath();
                ctx.moveTo(prismExitX, srcY);
                ctx.lineTo(screenX, targetY);
                ctx.stroke();
                ctx.restore();
            });

            // રંગીન ફોટોન કણોનું એનિમેશન
            spectralPhotons.forEach(sp => {
                sp.progress += sp.speed;
                if (sp.progress > 1) {
                    sp.progress = 0;
                    sp.colorIdx = Math.floor(Math.random() * colors.length);
                }

                let isAbsorbed = absorbedIndices.includes(sp.colorIdx);
                if (!isAbsorbed) {
                    let targetY = screenY + (sp.colorIdx * (screenH / (colors.length - 1)));
                    let curX = prismExitX + (screenX - prismExitX) * sp.progress;
                    let curY = srcY + (targetY - srcY) * sp.progress;

                    ctx.fillStyle = colors[sp.colorIdx];
                    ctx.beginPath();
                    ctx.arc(curX, curY, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // ૭. શોષણ કાળી રેખાઓ (Absorption Black Lines)
            if (hasGas) {
                gasLines[gasType].forEach(line => {
                    let y = screenY + (line.pos * screenH);
                    ctx.fillStyle = '#020617';
                    ctx.fillRect(screenX, y - 2.5, screenW, 5);

                    ctx.fillStyle = line.col;
                    ctx.font = 'bold 11px monospace';
                    ctx.textAlign = 'left';
                    ctx.fillText("← " + line.name, screenX + screenW + 6, y + 4);
                });
            }

            // સ્ટેટસ લખાણ
            ctx.fillStyle = '#f8fafc';
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'center';
            if (hasGas) {
                ctx.fillText("શોષણ વર્ણપટ (શોષાયેલ તરંગલંબાઈ પર ફોટોન શોષાય છે અને કાળી રેખાઓ દેખાય છે)", screenX - 50, screenY + screenH + 34);
            } else {
                ctx.fillText("સતત ઉત્સર્જન વર્ણપટ (સાત રંગોના ફોટોનનું સતત વહન)", screenX - 50, screenY + screenH + 34);
            }

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
